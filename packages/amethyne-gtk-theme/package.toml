[package]
name = "amethyne-gtk-theme"
type = "files"
description = "GTK theme and visual defaults for Amethyne Linux"
url = "https://github.com/cosita3cz/amethyne-linux"
arch = "any"
license = "custom"
dependencies = ["gtk3", "gtk4", "adwaita-icon-theme", "adwaita-cursors"]

[[install]]
source = "rootfs"
target = "/"
recursive = true
