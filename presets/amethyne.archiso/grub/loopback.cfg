search --no-floppy --set=archiso_img_dev --file "${iso_path}"
probe --set archiso_img_dev_uuid --fs-uuid "${archiso_img_dev}"

default=amethyne
timeout=5
timeout_style=menu

menuentry "%ISO_APPLICATION% (%ARCH%, loopback)" --class arch --class gnu-linux --class gnu --class os --id 'amethyne' {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/%ARCH%/%KERNEL_IMAGE% archisobasedir=%INSTALL_DIR% img_dev=UUID=${archiso_img_dev_uuid} img_loop="${iso_path}"
        initrd /%INSTALL_DIR%/boot/%ARCH%/%INITRAMFS_IMAGE%
}
